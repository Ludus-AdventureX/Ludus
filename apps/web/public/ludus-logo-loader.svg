<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1478 406" role="img" aria-labelledby="title desc">
  <title id="title">Ludus</title>
  <desc id="desc">Ludus logo drawn from left to right while loading.</desc>
  <style>
    .letter { font: 800 270px Arial Black,Arial,sans-serif; letter-spacing: 8px; fill: transparent; stroke: #171817; stroke-width: 8; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 4.8s cubic-bezier(.22,.61,.36,1) infinite; }
    .g2 { animation-delay: .28s; } .g3 { animation-delay: .56s; } .g4 { animation-delay: .84s; } .g5 { animation-delay: 1.12s; }
    .fill { opacity: 0; animation: resolve 4.8s ease-in-out infinite; }
    @keyframes draw { 0%,8% { stroke-dashoffset: 1200; fill: transparent; opacity: 1; } 42%,58% { stroke-dashoffset: 0; fill: #171817; opacity: 1; } 72% { opacity: .35; } 88%,100% { stroke-dashoffset: 0; fill: #171817; opacity: 1; } }
    @keyframes resolve { 0%,44% { opacity: 0; } 56%,66% { opacity: 1; } 73% { opacity: .35; } 86%,100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .letter { animation: none; fill: #171817; stroke: none; opacity: 1; } .fill { display: none; } }
  </style>
  <g aria-hidden="true">
    <text class="letter" x="6" y="285">L</text><text class="letter g2" x="290" y="285">U</text><text class="letter g3" x="580" y="285">D</text><text class="letter g4" x="870" y="285">U</text><text class="letter g5" x="1160" y="285">S</text>
  </g>
  <image class="fill" href="/logo.svg" x="0" y="0" width="1478" height="406" preserveAspectRatio="xMidYMid meet" />
</svg>
