schema_version: 1.0.0
project:
  display_name: Ludus
  repository_name: decision-lab
  repository_path: .
  plan_path: docs/product-plan
  golden_case: spherical_robot_rescue_vs_home_service
  default_capacity_profile: six_agent_72h
  default_deliverable_scope: hackathon_prototype
canonical_contracts:
  semantic_schema: 06-data-model.md
  api_events: 10-api-and-events.md
  contract_generation: 22-contract-generation-and-security-plan.md
  capacity_plan: 23-multi-agent-capacity-execution-plan.md
  execution_detail: 18-detailed-development-plan.md
  asset_ledger: 21-existing-asset-reuse-and-conversion.md
  decision_os_invariants: 26-decision-os-invariants-and-agent-engine-contract.md
  accepted_ccrs:
  - docs/contract-changes/CCR-20260719-002.md
  - docs/contract-changes/CCR-20260721-003.md
  - docs/contract-changes/CCR-20260804-DELIB-01.md
  runtime_rules: AGENTS.md
global_rules:
- one_write_owner_per_path
- contract_changes_require_accepted_ccr
- generated_contracts_are_read_only
- no_hidden_reasoning_persistence
- no_reference_repository_runtime_dependency
- fixture_never_impersonates_live
- workspace_scope_on_every_repository_operation
- qa_reports_defects_and_original_owner_fixes_source
- no_task_closes_without_implementation_test_and_user_visible_acceptance
- no_automatic_decided_transition
- decision_record_append_only
- report_requires_qualifying_run
- agent_engine_is_not_chat_messages
- responsibility_semantics_enforced_in_code
- validation_v1_v9_exact_set_and_blocker_fail_closed
contract_pipeline:
  runtime_source: services/api/app/**/schemas.py
  openapi_snapshot: packages/contracts/openapi.json
  typescript_types: packages/contracts/src/types.gen.ts
  web_client: apps/web/lib/api/client.ts
  drift_check: powershell -ExecutionPolicy Bypass -File scripts/generate_contracts.ps1 -Check
capacity_profiles:
  six_agent_72h:
    slots: 6
    elapsed_hours: 72
    deliverable_scope: hackathon_prototype
    required: true
  four_agent_108h:
    slots: 4
    elapsed_hours: 108
    deliverable_scope: full_mvp
    required: false
  three_agent_144h:
    slots: 3
    elapsed_hours: 144
    deliverable_scope: full_mvp
    required: false
owners:
  contract_lead:
    write_scope:
    - package.json
    - pnpm-workspace.yaml
    - compose.yaml
    - .gitignore
    - .env.example
    - services/api/alembic.ini
    - services/api/pyproject.toml
    - services/api/app/main.py
    - services/api/app/**/schemas.py
    - services/api/app/db.py
    - services/api/app/models.py
    - services/api/app/types.py
    - services/api/migrations/**
    - packages/contracts/**
    - scripts/export_openapi.py
    - scripts/generate_contracts.ps1
    - scripts/preflight.ps1
    - scripts/probe_deepseek.py
    - apps/web/Dockerfile
    - services/api/Dockerfile
    - .github/workflows/**
    - THIRD_PARTY_NOTICES.md
  ways_agent_pipeline:
    write_scope:
    - ways/**
    - method-packs/**
    - services/api/app/methods/**
    - services/api/app/agents/**
    - services/api/app/strategic_lenses/**
    - services/api/app/reports/**
    - services/api/app/workers/analysis_worker.py
    - fixtures/spherical-robot/**
    - scripts/install_method_pack.py
    - scripts/seed_demo.py
    - scripts/verify_fixture.py
    exclusions:
    - services/api/app/**/schemas.py
  case_api_data:
    write_scope:
    - services/api/app/auth/**
    - services/api/app/tenancy/**
    - services/api/app/subjects/**
    - services/api/app/cases/**
    - services/api/app/conversations/**
    - services/api/app/evidence/**
    - services/api/app/analyses/**
    - services/api/app/decisions/**
    - services/api/app/connectors/**
    - services/api/app/files/**
    - services/api/app/security/**
    - docs/security-exceptions.md
    exclusions:
    - services/api/app/**/schemas.py
    - services/api/app/reports/publisher.py
  web_ux:
    write_scope:
    - apps/web/**
    - design/**
    - scripts/snapshot_look.py
    exclusions:
    - apps/web/components/simulation/**
    - apps/web/tests/**
    - apps/web/**/*.test.ts
    - apps/web/**/*.test.tsx
    - apps/web/playwright.config.ts
    - apps/web/Dockerfile
  simulation_graph:
    write_scope:
    - services/api/app/simulations/**
    - services/api/app/deliberation/**
    - apps/web/components/simulation/**
    exclusions:
    - services/api/app/**/schemas.py
  qa_release:
    write_scope:
    - e2e/**
    - services/api/tests/**
    - apps/web/tests/**
    - apps/web/**/*.test.ts
    - apps/web/**/*.test.tsx
    - apps/web/playwright.config.ts
    - docs/runbooks/**
    - docs/handoffs/**
    - artifacts/**
    - scripts/verify_decision_os_contracts.py
    source_fix_policy: handoff_to_original_owner
tasks:
- id: task-01
  title: Bootstrap monorepo and reproducible environment
  owner: contract_lead
  depends_on: []
  plan_section: 18-detailed-development-plan.md#task-1-初始化-monorepo-与可重复环境
  write_scope:
  - package.json
  - pnpm-workspace.yaml
  - compose.yaml
  - .gitignore
  - .env.example
  - services/api/alembic.ini
  - services/api/app/main.py
  - services/api/pyproject.toml
  - packages/contracts/**
  - scripts/preflight.ps1
  - scripts/probe_deepseek.py
  - scripts/export_openapi.py
  - scripts/generate_contracts.ps1
  acceptance:
  - uv run --project services/api pytest services/api/tests/test_health.py -q
  - powershell -ExecutionPolicy Bypass -File scripts/generate_contracts.ps1 -Check
  handoff_artifacts:
  - bootstrap_report
  - openapi_snapshot
  - generated_types
- id: task-01w
  title: Web UX bootstrap and immutable Look V7 snapshot
  owner: web_ux
  depends_on:
