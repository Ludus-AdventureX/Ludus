  - design/**
  - scripts/snapshot_look.py
  forbidden_scope:
  - apps/web/components/simulation/**
  - apps/web/tests/**
  - apps/web/**/*.test.ts
  - apps/web/**/*.test.tsx
  - apps/web/playwright.config.ts
  - apps/web/Dockerfile
  - look/**
  acceptance:
  - py -3.12 scripts/snapshot_look.py --check
  - pnpm --dir apps/web build
  - pnpm --dir apps/web exec playwright install chromium
  handoff_artifacts:
  - look_source_manifest
  - generated_theme_tokens
  - web_bootstrap_report
- id: task-02
