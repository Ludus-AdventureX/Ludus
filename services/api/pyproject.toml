[project]
name = "decision-lab-api"
version = "0.1.0"
description = "Ludus FastAPI service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "pyjwt[crypto]>=2.10,<3",
  "httpx>=0.28,<1",
  "openai>=2.0,<3",
  "pyyaml>=6.0,<7",
  "sse-starlette>=2.4,<3",
  "jinja2>=3.1,<4",
  "playwright>=1.55,<2",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2"
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "pip-audit>=2.9,<3",
  "jsonschema>=4.23,<5"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100