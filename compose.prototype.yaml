# Guest Simulation Alpha prototype stack: Web + API + Postgres, one origin.
#
#   Build/start: docker compose --env-file .env.prototype -f compose.prototype.yaml up -d --build
#   Smoke:       docker compose --env-file .env.prototype -f compose.prototype.yaml run --rm smoke
#
# Copy .env.prototype.example to .env.prototype first and fill in real values;
# never commit the filled file (already covered by .gitignore).
#
# HTTPS: no managed cloud platform is assumed. The integration lane exposes
# host port ${WEB_PORT} through a temporary HTTPS ingress (for example
# `cloudflared tunnel --url http://localhost:3000`) and sets WEB_ORIGIN plus
# AUTH_ALLOWED_ORIGINS to that public URL. The web container proxies /api/* to
# FastAPI internally (NEXT_PUBLIC_API_BASE=/api), so browsers only ever see
# one HTTPS origin.
#
# Migrations run as an explicit startup command (the `migrate` service) before
# the API accepts traffic. Guest Alpha data is created by the API runtime when
# ENABLE_GUEST_ALPHA=true; no seed job and no model API key are required
# (FIXTURE_MODE=true), and no worker service exists in this stack.

name: decision-lab-prototype

x-db-env: &db-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-decision_lab}
  POSTGRES_USER: ${POSTGRES_USER:-decision_lab}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prototype}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-decision_lab}
      POSTGRES_USER: ${POSTGRES_USER:-decision_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prototype}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-decision_lab} -d ${POSTGRES_DB:-decision_lab}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - decision_lab_prototype_db:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    build: services/api
    image: decision-lab-api:prototype
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *db-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: decision-lab-api:prototype
    environment:
      <<: *db-env
      ENABLE_GUEST_ALPHA: ${ENABLE_GUEST_ALPHA:-true}
      FIXTURE_MODE: ${FIXTURE_MODE:-true}
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN to the public HTTPS origin}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env.prototype}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_SESSION_TTL_MINUTES: ${AUTH_SESSION_TTL_MINUTES:-720}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:?set AUTH_ALLOWED_ORIGINS to the public HTTPS origin}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api}
    image: decision-lab-web:prototype
    environment:
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN to the public HTTPS origin}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Exercises the same-origin /api proxy end to end (web -> FastAPI).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # Explicit one-off: REAL release-evidence smoke over HTTP through the web
  # proxy (guest bootstrap -> run -> replay -> cross-guest uniform 404).
  smoke:
    image: decision-lab-api:prototype
    profiles: ["ops"]
    environment:
      SMOKE_BASE_URL: ${SMOKE_BASE_URL:-http://web:3000}
      SMOKE_ORIGIN: ${SMOKE_ORIGIN:-${WEB_ORIGIN:?set WEB_ORIGIN to the public HTTPS origin}}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    command: ["python", "-m", "app.prototype.smoke_guest_alpha"]
    restart: "no"

volumes:
  decision_lab_prototype_db:
